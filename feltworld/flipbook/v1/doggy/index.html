 }turn.leaf.style.transform=`rotateY(${turn.direction*-180*turn.progress}deg)`;turn.leaf.style.setProperty('--shade',Math.sin(turn.progress*Math.PI)*.8);turn.stationary.hidden=turn.progress>=.5;}
function finish(commit){if(!turn)return;if(commit)index=turn.target;if(turn.boundary){turn.layer.remove();book.style.visibility='';}else{turn.leaf.remove();turn.stationary.remove();}turn=null;animating=false;book.classList.remove('dragging');render();}
function settle(commit){if(!turn)return;animating=true;const from=turn.progress,to=commit?1:0;if(reduced.matches){finish(commit);return;}const duration=Math.max(160,(turn.boundary?850:560)*Math.abs(to-from));let start;function frame(time){start??=time;const t=Math.min(1,(time-start)/duration),e=turn.boundary?t*t*(3-2*t):1-Math.pow(1-t,3);setProgress(from+(to-from)*e);if(t<1)requestAnimationFrame(frame);else finish(commit)}requestAnimationFrame(frame);}
async function go(target,direction){if(animating||pointer||target<0||target>=scenes.length||target===index)return;animating=true;await Promise.all([waitForArt(index),waitForArt(target)]);animating=false;if(begin(direction,target))settle(true);}
function navigate(direction){go(index+direction,direction);}
// Treat a wheel/trackpad burst as one gesture, including its momentum tail.
let wheelGesture={last:0,distance:0,used:false};
book.addEventListener('wheel',e=>{
 if(e.ctrlKey||editor.open)return;
 e.preventDefault();
 const now=performance.now();
 if(now-wheelGesture.last>220)wheelGesture={last:now,distance:0,used:false};
 wheelGesture.last=now;
 if(wheelGesture.used)return;
 const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
 const pixels=delta*(e.deltaMode===1?16:e.deltaMode===2?book.clientHeight:1);
 wheelGesture.distance+=pixels;
 if(Math.abs(wheelGesture.distance)<48)return;
 wheelGesture.used=true;
 if(!animating&&!pointer)navigate(Math.sign(wheelGesture.distance));
},{passive:false});
previous.onclick=()=>navigate(-1);next.onclick=()=>navigate(1);
function jump(target){go(target,Math.sign(target-index));}
document.querySelector('#first').onclick=()=>jump(0);document.querySelector('#last').onclick=()=>jump(scenes.length-1);
document.addEventListener('keydown',e=>{if(e.target.closest('summary,a,input,textarea,select,dialog'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();navigate(e.key==='ArrowRight'?1:-1)}});
book.addEventListener('pointerdown',e=>{if(animating||pointer||e.isPrimary===false||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastTime:performance.now(),velocity:0,moved:false};book.setPointerCapture(e.pointerId);});
book.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>8)pointer.moved=true;if(!turn){if(Math.abs(dx)<10)return;if(Math.abs(dy)>Math.abs(dx)){book.releasePointerCapture(e.pointerId);pointer=null;return;}if(!begin(dx<0?1:-1))return;book.classList.add('dragging');}const now=performance.now();pointer.velocity=(e.clientX-pointer.lastX)/Math.max(1,now-pointer.lastTime);pointer.lastX=e.clientX;pointer.lastTime=now;setProgress(-dx*turn.direction/(book.clientWidth*.65));});
function release(e,cancel){if(!pointer||e.pointerId!==pointer.id)return;const {velocity,moved,x,y}=pointer;pointer=null;if(turn)settle(!cancel&&(turn.progress>.22||(turn.progress>.04&&velocity*turn.direction<-.5)));else if(!cancel&&!moved&&Math.hypot(e.clientX-x,e.clientY-y)<=8){const rect=book.getBoundingClientRect();navigate(isCover(index)?(index===0?1:-1):(e.clientX<rect.left+rect.width/2?-1:1));}book.classList.remove('dragging');}
book.addEventListener('pointerup',e=>release(e,false));book.addEventListener('pointercancel',e=>release(e,true));book.addEventListener('lostpointercapture',e=>{if(pointer)release(e,true)});
const editor=document.querySelector('#editor');
let editingSide='right';
function loadEditor(){
 const copy=copyFor(index,editingSide);
 document.querySelector('#editor-heading').textContent=scenes[index][1];
 document.querySelector('#copy-page').value=editingSide;
 document.querySelector('#copy-input').value=copy.text;document.querySelector('#copy-style').value=copy.style;document.querySelector('#copy-size').value=copy.size;document.querySelector('#copy-top').value=copy.top;
}
document.querySelector('#text-settings').onclick=()=>{if(isCover(index)||turn||animating)return;editingSide=copyFor(index,'right').text.trim()?'right':'left';loadEditor();editor.showModal();};
document.querySelector('#close-editor').onclick=()=>editor.close();
document.querySelector('#copy-page').onchange=e=>{editingSide=e.target.value;loadEditor();};
function saveEdits(){try{localStorage.setItem(storageKey,JSON.stringify(draftEdits));document.querySelector('#save-note').textContent='Saved privately in this browser.';}catch{document.querySelector('#save-note').textContent='Changes work for this visit; browser storage is unavailable.';}}
function updateCopy(){
 draftEdits[copyKey(index,editingSide)]={text:document.querySelector('#copy-input').value,style:document.querySelector('#copy-style').value,size:Number(document.querySelector('#copy-size').value),top:Number(document.querySelector('#copy-top').value)};
 saveEdits();if(!turn)render();
}
for(const id of ['copy-input','copy-style','copy-size','copy-top'])document.querySelector('#'+id).addEventListener('input',updateCopy);
document.querySelector('#reset-copy').onclick=()=>{delete draftEdits[copyKey(index,editingSide)];saveEdits();loadEditor();render();};
window.addEventListener('resize',()=>{if(!turn)render();});
render();
</script>
